        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ----------------------------------------------------------- Sincronizacao
  /api/sync:
    post:
      tags: [Sincronizacao]
      summary: Sincronizacao administrativa de tabelas permitidas
      operationId: syncData
      security: [{ bearerAuth: [] }]
      x-roles: [admin]
      description: Aplica alteracoes em lote numa transacao. Apenas tabelas/colunas da whitelist de `utils/syncPolicy.js`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                last_sync_timestamp: { type: [string, 'null'], format: date-time }
                changes:
                  type: object
                  description: Mapa tabela -> { created, updated }.
                  additionalProperties:
                    type: object
                    properties:
                      created: { type: array, items: { type: object } }
                      updated: { type: array, items: { type: object } }
      responses:
        '200':
          description: Sincronizacao concluida.
          content:
            application/json:
              schema:
                type: object
                properties:
                  new_sync_timestamp: { type: string, format: date-time }
                  server_changes: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ------------------------------------------------------------------- LOINC
  /api/internal/loinc/term:
    post:
      tags: [LOINC (interno)]
      summary: Mapeia um termo clinico para LOINC
      operationId: mapSingleTerm
      security: [{ bearerAuth: [] }]
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [term]
              properties:
                term: { type: string }
            example:
              term: Hemoglobina
      responses:
        '200':
          description: Resultado do mapeamento.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoincResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/internal/loinc/text:
    post:
      tags: [LOINC (interno)]
      summary: Mapeia termos LOINC em um bloco de texto
      operationId: mapTextBlock
      security: [{ bearerAuth: [] }]
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
            example:
              text: 'Hemoglobina: 12,1 g/dL. Glicose em jejum: 84 mg/dL.'
      responses:
        '200':
          description: Termos mapeados e resumo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoincResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  # --------------------------------------------------------------------- RAG
  /api/internal/rag/search:
    post:
      tags: [RAG (interno)]
      summary: Busca semantica na base de diretrizes
      operationId: searchKnowledgeBase
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RagSearchRequest' }
            example:
              query: conduta na pre-eclampsia
              topK: 3
      responses:
        '200':
          description: Trechos mais relevantes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  source: { type: string }
                  query: { type: string }
                  resultados:
                    type: array
                    items: { $ref: '#/components/schemas/RagChunk' }
                  total: { type: integer }
                  tempo_ms: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/internal/rag/chat:
    post:
      tags: [RAG (interno)]
      summary: Chat clinico (busca + geracao com fontes)
      operationId: askClinicalChat
      security: [{ bearerAuth: [] }]
      description: A pergunta e sanitizada (PII) antes de ir ao LLM.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RagChatRequest' }
            example:
              query: Quais sinais de alarme na gestacao?
      responses:
        '200':
          description: Resposta com fontes citadas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RagChatResponse' }
              example:
                source: rag-v2-gemini
                query: Quais sinais de alarme na gestacao?
                resposta: Resposta sintetica de exemplo. Procure atendimento em caso de sangramento.
                fontes:
                  - fonte: Manual MS Gestacao Alto Risco
                    secao: Sinais de alarme
                    relevancia: 0.8731
                tempo_ms: 1240
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/internal/rag/chat/agents:
    post:
      tags: [RAG (interno)]
      summary: Chat multiagente (materno/fetal)
      operationId: askClinicalAgentsChat
      security: [{ bearerAuth: [] }]
      description: |
        Quando `patient_id` e informado, o contexto clinico e carregado com a mesma autorizacao por
        recurso do prontuario (gestante propria, medico vinculado ou admin), sem identificadores.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RagAgentsRequest' }
            example:
              query: A paciente relata pressao 135/85, o que observar?
              patient_id: 1
      responses:
        '200':
          description: Resposta sintetizada pelos agentes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RagAgentsResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/internal/rag/stats:
    get:
      tags: [RAG (interno)]
      summary: Estatisticas do indice vetorial
      operationId: getRAGStats
      security: [{ bearerAuth: [] }]
      x-roles: [admin]
      responses:
        '200':
          description: Estatisticas do Pinecone.
          content:
            application/json:
              schema:
                type: object
                properties:
                  source: { type: string }
                  stats: { type: object, additionalProperties: true }
                  ambiente: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ------------------------------------------------------------------ Agente
  /api/agent/maternal-analysis:
    post:
      tags: [Agente]
      summary: Analise do agente materno sobre o prontuario de uma gestante
      operationId: handleMaternalAnalysis
      security: [{ bearerAuth: [] }]
      x-roles: [admin, medico]
      description: |
        `medico` precisa de vinculo ativo com a gestante. Para medico, ID sem vinculo e ID inexistente
        recebem o mesmo `403` (evita enumeracao de IDs). Rate limit `CLINICAL_RATE_LIMIT_MAX`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MaternalAnalysisRequest' }
            example:
              patientId: 1
              query: A paciente apresenta cefaleia. O que as diretrizes recomendam?
      responses:
        '200':
          description: Analise gerada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaternalAnalysisResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  # --------------------------------------------------------------- Auditoria
  /api/admin/audit:
    get:
      tags: [Auditoria]
      summary: Consulta a trilha de auditoria
      operationId: listAuditLogs
      security: [{ bearerAuth: [] }]
      x-roles: [admin]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, default: 50 }, description: Limitado ao maximo do servidor. }
        - { name: actor_id, in: query, schema: { type: integer } }
        - { name: action, in: query, schema: { type: string }, example: USER_LOGIN }
        - { name: resource, in: query, schema: { type: string }, example: users }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Pagina de registros.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditPage' }
              example:
                page: 1
                limit: 50
                total: 1
                results:
                  - id: 1
                    created_at: '2026-10-01T12:00:00Z'
                    actor_id: 1
                    actor_role: admin
                    action: USER_LOGIN
                    resource: users
                    resource_id: '1'
                    ip_address: 127.0.0.1
                    user_agent: exemplo
                    outcome: SUCCESS
                    detail: { role: admin }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ------------------------------------------------------------- Crescimento
  /api/growth/percentile:
    post:
      tags: [Crescimento]
      summary: Calcula o percentil de peso fetal estimado (Hadlock)
      operationId: calculatePercentile
      security: [{ bearerAuth: [] }]
      description: Qualquer usuario autenticado. Rate limit `CLINICAL_RATE_LIMIT_MAX`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PercentileRequest' }
            example:
              gestationalAgeWeeks: 24
              biometrics: { dbp: 60, cc: 220, ca: 200, cf: 43 }
      responses:
        '200':
          description: Peso estimado e percentil.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PercentileResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/growth/chart:
    get:
      tags: [Crescimento]
      summary: Curvas de referencia P10/P50/P90 por semana
      operationId: getGrowthChart
      security: [{ bearerAuth: [] }]
      description: Qualquer usuario autenticado. Rate limit `CLINICAL_RATE_LIMIT_MAX`.
      responses:
        '200':
          description: Pontos da curva de Hadlock.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/GrowthChartPoint' }
              example:
                - { semana: 10, p10: 29, p50: 35, p90: 40 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  # --------------------------------------------------------------- Historico
  /api/history/pregnancies/{pregnancyId}:
    parameters:
      - $ref: '#/components/parameters/PregnancyIdPath'
    get:
      tags: [Historico]
      summary: Historico clinico (biometrias fetais e pesos maternos)
      operationId: getClinicalHistory
      security: [{ bearerAuth: [] }]
      x-roles: [admin, gestante, medico]
      parameters:
        - $ref: '#/components/parameters/HistoryFrom'
        - $ref: '#/components/parameters/HistoryTo'
        - $ref: '#/components/parameters/HistoryOrder'
        - $ref: '#/components/parameters/HistoryLimit'
      responses:
        '200':
          description: Series historicas da gestacao.
          content:
            application/json:
              schema:
                type: object
                properties:
                  pregnancy_id: { type: integer }
                  fetal_biometries:
                    type: array
                    items: { $ref: '#/components/schemas/FetalBiometry' }
                  maternal_weights:
                    type: array
                    items: { $ref: '#/components/schemas/MaternalWeight' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/history/pregnancies/{pregnancyId}/fetal-biometries:
    parameters:
      - $ref: '#/components/parameters/PregnancyIdPath'
    get:
      tags: [Historico]
      summary: Lista biometrias fetais
      operationId: getFetalBiometries
      security: [{ bearerAuth: [] }]
      x-roles: [admin, gestante, medico]
      parameters:
        - $ref: '#/components/parameters/HistoryFrom'
        - $ref: '#/components/parameters/HistoryTo'
        - $ref: '#/components/parameters/HistoryOrder'
        - $ref: '#/components/parameters/HistoryLimit'
      responses:
        '200':
          description: Biometrias registradas.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FetalBiometry' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Historico]
      summary: Registra biometria fetal
      operationId: createFetalBiometry
      security: [{ bearerAuth: [] }]
      x-roles: [admin, medico]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateFetalBiometryRequest' }
            example:
              gestational_age_weeks: 24
              dbp_mm: 60
              cc_mm: 220
              ca_mm: 200
              cf_mm: 43
              measured_at: '2026-09-15'
      responses:
        '201':
          description: Biometria registrada (com peso estimado e percentil calculados no servidor).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FetalBiometry' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/history/pregnancies/{pregnancyId}/maternal-weights:
    parameters:
      - $ref: '#/components/parameters/PregnancyIdPath'
    get:
      tags: [Historico]
      summary: Lista pesos maternos
      operationId: getMaternalWeights
      security: [{ bearerAuth: [] }]
      x-roles: [admin, gestante, medico]
      parameters:
        - $ref: '#/components/parameters/HistoryFrom'
        - $ref: '#/components/parameters/HistoryTo'
        - $ref: '#/components/parameters/HistoryOrder'
        - $ref: '#/components/parameters/HistoryLimit'
      responses:
        '200':
          description: Pesos registrados.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MaternalWeight' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Historico]
      summary: Registra peso materno
      operationId: createMaternalWeight
      security: [{ bearerAuth: [] }]
      x-roles: [admin, medico]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMaternalWeightRequest' }
            example:
              weight_kg: 68.4
              measured_at: '2026-09-15'
      responses:
        '201':
          description: Peso registrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaternalWeight' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token obtido em `POST /api/users/login`. Payload `{ id, role }`.

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    PregnancyIdPath:
      name: pregnancyId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    HistoryFrom:
      name: from
      in: query
      schema: { type: string, format: date }
      description: Data inicial (YYYY-MM-DD).
    HistoryTo:
      name: to
      in: query
      schema: { type: string, format: date }
      description: Data final (YYYY-MM-DD); nao pode ser anterior a `from`.
    HistoryOrder:
      name: order
      in: query
      schema: { type: string, enum: [asc, desc], default: asc }
    HistoryLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 500, default: 200 }

  responses:
    BadRequest:
      description: Requisicao invalida.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: Nenhum campo valido para atualizar }
    Unauthorized:
      description: Token ausente, malformado, invalido ou expirado (ou credenciais invalidas no login).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: Token inválido ou expirado }
    Forbidden:
      description: 'Papel nao autorizado ou sem acesso ao recurso (ex.: medico sem vinculo).'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: Acesso negado }
    NotFound:
      description: Recurso nao encontrado.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: Gestante nao encontrada }
    NotFoundText:
      description: Recurso nao encontrado (resposta em texto puro).
      content:
        text/plain:
          schema: { type: string }
          example: Usuario nao encontrado
    Conflict:
      description: E-mail ja cadastrado.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: Email ja cadastrado }
    TooManyRequests:
      description: Limite de requisicoes excedido.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: Muitas tentativas. Tente novamente mais tarde. }
    InternalError:
      description: Erro interno.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: Erro interno }

  schemas:
    DataExport:
      type: object
      description: Exportacao do titular. As secoes de gestante so aparecem para o papel gestante.
      required: [formato, gerado_em, titular, consentimentos]
      properties:
        formato:
          type: object
          properties:
            nome: { type: string, example: myfetus-exportacao-titular }
            versao: { type: string, example: '1.0' }
        gerado_em: { type: string, format: date-time }
        titular:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
            email: { type: string }
            birthdate: { type: string }
            role: { type: string, enum: [gestante, medico, admin] }
            is_active: { type: boolean }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
        consentimentos:
          type: array
          items:
            type: object
            properties:
              purpose: { type: string }
              version: { type: string }
              decision: { type: string, enum: [accepted, refused, revoked] }
              created_at: { type: string, format: date-time }
        prontuario: { type: [object, 'null'] }
        gestacoes: { type: array, items: { type: object } }
        eventos: { type: array, items: { type: object } }
        biometria_fetal: { type: array, items: { type: object } }
        peso_materno: { type: array, items: { type: object } }
        pedidos_de_exame: { type: array, items: { type: object } }
        documentos: { type: array, items: { type: object } }
        vinculos_medicos: { type: array, items: { type: object } }
        perfil_profissional: { type: [object, 'null'], description: Somente para o papel medico. }
        observacoes: { type: array, items: { type: string } }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        details: { type: string }
    Message:
      type: object
      properties:
        message: { type: string }
    Role:
      type: string
      enum: [gestante, medico, admin]

    User:
      type: object
      description: Usuario sem senha, hash de lookup ou versao de chave.
      additionalProperties: true
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        birthdate: { type: string, format: date }
        role: { $ref: '#/components/schemas/Role' }
        created_at: { type: string, format: date-time }
    CreateUserRequest:
      type: object
      required: [name, email, password, birthdate, consents]
      properties:
        name: { type: string, minLength: 1 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        birthdate: { type: string, format: date }
        consents:
          type: array
          description: Aceite das finalidades obrigatorias, na versao vigente.
          items: { $ref: '#/components/schemas/ConsentReference' }
    UpdateUserRequest:
      type: object
      minProperties: 1
      properties:
        name: { type: string }
        email: { type: string, format: email }
        birthdate: { type: string, format: date }
        password: { type: string, minLength: 8 }
        role: { $ref: '#/components/schemas/Role' }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    LoginResponse:
      type: object
      properties:
        message: { type: string }
        token: { type: string, description: JWT para o header Authorization. }
        user:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
            email: { type: string }
            role: { $ref: '#/components/schemas/Role' }
            pregnant_id: { type: [integer, 'null'] }
            doctor_approval_status: { type: string, enum: [pending, approved, rejected, revoked] }
            doctor_approval_reason: { type: [string, 'null'] }
        consent:
          description: 'Termos pendentes de aceite (ex.: nova versao). `null` se o status estiver indisponivel.'
          oneOf:
            - type: 'null'
            - type: object
              properties:
                required: { type: boolean }
                pending:
                  type: array
                  items: { $ref: '#/components/schemas/ConsentReference' }

    ConsentReference:
      type: object
      required: [purpose, version]
      properties:
        purpose:
          type: string
          enum: [termos_de_uso_gestante, termos_de_uso_medico, politica_de_privacidade, tratamento_dados_saude, uso_ia, pesquisa_usabilidade]
        version: { type: string, examples: [0.1-rascunho] }
    ConsentError:
      type: object
      required: [error]
      properties:
        error: { type: string }
        code: { type: string, enum: [CONSENT_REQUIRED, CONSENT_VERSION_OUTDATED, CONSENT_INVALID] }
    ConsentPolicy:
      type: object
      properties:
        purposes:
          type: array
          items:
            type: object
            properties:
              purpose: { type: string }
              title: { type: string }
              kind: { type: string, enum: [acceptance, acknowledgment, consent] }
              roles: { type: array, items: { type: string, enum: [gestante, medico] } }
              required: { type: boolean }
              highlighted: { type: boolean }
              version: { type: string }
              document_date: { type: string, format: date }
              text: { type: string, description: Texto do documento (rascunho ate a aprovacao da gestao). }
    ConsentStatus:
      type: object
      properties:
        required:
          type: boolean
          description: true se o papel exige consentimento e ha finalidade obrigatoria pendente.
        pending:
          type: array
          items: { $ref: '#/components/schemas/ConsentReference' }
        purposes:
          type: array
          items:
            type: object
            properties:
              purpose: { type: string }
              kind: { type: string, enum: [acceptance, acknowledgment, consent] }
              current_version: { type: string }
              required: { type: boolean }
              status: { type: string, enum: [pending, accepted, outdated, refused, revoked] }
              decided_version: { type: [string, 'null'] }
              decided_at: { type: [string, 'null'], format: date-time }
    CreateDoctorRequest:
      type: object
      required: [name, email, password, birthdate, crm, crm_estado, consents]
      properties:
        consents:
          type: array
          description: Termos de Uso do medico e ciencia da Politica de Privacidade, na versao vigente.
          items: { $ref: '#/components/schemas/ConsentReference' }
        name: { type: string }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        birthdate: { type: string, format: date }
        crm: { type: string }
        crm_estado: { type: string, minLength: 2, maxLength: 2, description: UF do CRM. }
        especialidade: { type: string }
        telefone: { type: string }

    DoctorApprovalStatus:
      type: object
      required: [approval_status]
      properties:
        approval_status: { type: string, enum: [pending, approved, rejected, revoked] }
        approval_reason: { type: [string, 'null'] }
    DoctorApprovalDecision:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [approve, reject, revoke] }
        reason: { type: string, maxLength: 500 }
    DoctorResubmissionRequest:
      type: object
      required: [crm, crm_estado]
      properties:
        crm: { type: string, minLength: 1, maxLength: 20 }
        crm_estado: { type: string, minLength: 2, maxLength: 2 }
        especialidade: { type: [string, 'null'] }
        telefone: { type: [string, 'null'] }
    DoctorApprovalRecord:
      allOf:
        - $ref: '#/components/schemas/DoctorApprovalStatus'
        - type: object
          properties:
            id: { type: integer }
            user_id: { type: integer }
            name: { type: string }
            email: { type: string, format: email }
            birthdate: { type: string, format: date }
            crm: { type: string }
            crm_estado: { type: string }
            especialidade: { type: [string, 'null'] }
            telefone: { type: [string, 'null'] }
            is_active: { type: boolean }

    PregnantRecord:
      type: object
      additionalProperties: true
      properties:
        id: { type: integer }
        user_id: { type: integer }
    PregnantSummary:
      type: object
      properties:
        pregnant_id: { type: integer }
