          type: object
          properties:
            green: { type: integer }
            yellow: { type: integer }
            red: { type: integer }
        categories:
          type: object
          additionalProperties:
            type: object
            properties:
              level: { type: string, enum: [green, yellow, red] }
              label: { type: string }
              detail: { type: string }

    Pregnancy:
      type: object
      additionalProperties: true
      properties:
        id: { type: integer }
        pregnant_id: { type: integer }
        weeks: { type: integer }
        is_checked: { type: boolean }
        dum: { type: string, format: date }
        dpp: { type: string, format: date }
        ccn: { type: number }
        dgm: { type: number }
        glicemia: { type: number }
        frequencia_cardiaca: { type: number }
        altura_uterina: { type: number }
        regularidade_do_ciclo: { type: boolean }
