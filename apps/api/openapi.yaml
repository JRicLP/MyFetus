      responses:
        '200':
          description: Gestante encontrada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  pregnant_id: { type: integer }
                  patient_name: { type: string }
                  patient_email: { type: string }
                  already_linked: { type: boolean }
              example:
                pregnant_id: 1
                patient_name: Maria Exemplo
                patient_email: maria.exemplo@example.com
                already_linked: false
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/doctor-patient-links:
    post:
      tags: [Vinculos]
      summary: Vincula o medico autenticado a uma gestante
