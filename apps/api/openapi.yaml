openapi: 3.1.0
info:
  title: MyFetus API
  version: 3.0.0-dev
  summary: API REST do MyFetus (gestante, prontuario obstetrico e apoio a decisao com IA).
  description: |
    Contrato HTTP da API do MyFetus (ciclo 2026.2), mantido em `apps/api/openapi.yaml`.

    **Autenticacao:** a maioria das rotas exige `Authorization: Bearer <JWT>`, obtido em
    `POST /api/users/login`. O token expira conforme `JWT_EXPIRES_IN` (padrao 8h).

    **Papeis:** `gestante`, `medico` e `admin`. A extensao `x-roles` de cada operacao lista os
    papeis aceitos pela rota; quando ausente, qualquer usuario autenticado passa pela rota.
    Varias rotas aplicam ainda autorizacao por recurso: a gestante acessa apenas o proprio
    registro e o medico apenas gestantes com vinculo ativo em `doctor_patient_links`.

    **Exemplos:** todos os exemplos sao sinteticos. Nenhum dado real de paciente.

    **Verificacao:** `tests/openapiContract.test.js` (CI) falha se uma rota do Express nao estiver
    documentada aqui, se houver path documentado sem rota, ou se autenticacao/papeis divergirem.
servers:
  - url: http://localhost:3000
    description: Desenvolvimento local
tags:
  - name: Sistema
  - name: Usuarios
  - name: Consentimento
  - name: Privacidade
  - name: Medicos
  - name: Gestantes
  - name: Gestacoes
  - name: Eventos
  - name: Documentos
  - name: Exames
  - name: Medicoes
  - name: Vinculos
  - name: Sincronizacao
  - name: LOINC (interno)
  - name: RAG (interno)
  - name: Agente
  - name: Auditoria
  - name: Crescimento
  - name: Historico

paths:
  /health:
    get:
      tags: [Sistema]
      summary: Verifica a prontidao das dependencias do backend
      operationId: health
      security: []
      responses:
        '200':
          description: Dependencias disponiveis ou degradadas.
          content:
            application/json:
              schema: { type: object }
        '503':
          description: Dependencia bloqueante indisponivel.
          content:
            application/json:
              schema: { type: object }

  /ping:
    get:
      tags: [Sistema]
      summary: Verifica se o backend esta no ar
      operationId: ping
      security: []
      responses:
        '200':
          description: Backend ativo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
              example:
                message: Backend funcionando corretamente.

  # ---------------------------------------------------------------- Usuarios
  /api/users:
    post:
      tags: [Usuarios]
      summary: Cadastra uma gestante (usuario com papel gestante)
      operationId: createUser
      security: []
      description: |
        Rota publica com rate limit de cadastro (`REGISTER_RATE_LIMIT_MAX`).
        Exige o aceite (`consents`) de todas as finalidades obrigatorias na versao vigente
        de `GET /api/consents/policy` (E7-01.1). Usuario e consentimento sao gravados na
        mesma transacao.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
            example:
              name: Maria Exemplo
              email: maria.exemplo@example.com
              password: senha-sintetica-123
              birthdate: '1995-04-12'
              consents:
                - { purpose: termos_de_uso_gestante, version: 0.1-rascunho }
                - { purpose: politica_de_privacidade, version: 0.1-rascunho }
                - { purpose: tratamento_dados_saude, version: 0.1-rascunho }
                - { purpose: uso_ia, version: 0.1-rascunho }
      responses:
        '201':
          description: Usuario criado (sem senha nem hashes).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400':
          description: Dados invalidos ou aceite obrigatorio ausente (`code` = `CONSENT_REQUIRED`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentError' }
              example:
                error: Aceite do termo de uso e da política de privacidade é obrigatório
                code: CONSENT_REQUIRED
        '409':
          description: E-mail ja cadastrado, ou aceite de versao desatualizada (`code` = `CONSENT_VERSION_OUTDATED`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      tags: [Usuarios]
      summary: Lista todos os usuarios
      operationId: getUsers
      security: [{ bearerAuth: [] }]
      x-roles: [admin]
      responses:
        '200':
          description: Lista de usuarios.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/users/login:
    post:
      tags: [Usuarios]
      summary: Autentica e retorna o JWT
      operationId: loginUser
      security: []
      description: Rota publica com rate limit de login (`AUTH_RATE_LIMIT_MAX`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            example:
              email: maria.exemplo@example.com
              password: senha-sintetica-123
      responses:
        '200':
          description: Login bem-sucedido.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
              example:
                message: Login bem-sucedido
                token: eyJhbGciOiJIUzI1NiJ9.EXEMPLO-SINTETICO.assinatura
                user:
                  id: 5
                  name: Maria Exemplo
                  email: maria.exemplo@example.com
                  role: gestante
                  pregnant_id: 1
                consent:
                  required: false
                  pending: []
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/users/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Usuarios]
      summary: Consulta um usuario
      operationId: getUserById
      security: [{ bearerAuth: [] }]
      description: Permitido ao proprio usuario, a `admin` e ao medico com vinculo ativo com a gestante.
      responses:
        '200':
          description: Usuario encontrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFoundText' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [Usuarios]
      summary: Atualiza um usuario
      operationId: updateUser
      security: [{ bearerAuth: [] }]
      description: |
        Mesma regra de acesso do GET. Campos aceitos dependem de quem atualiza:
        o proprio usuario altera `name`, `email`, `birthdate` e `password`; o medico vinculado
        altera `name` e `birthdate`; `admin` tambem pode alterar `role`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserRequest' }
            example:
              name: Maria Exemplo Silva
      responses:
        '200':
          description: Usuario atualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFoundText' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Usuarios]
      summary: Remove um usuario
      operationId: deleteUser
      security: [{ bearerAuth: [] }]
      x-roles: [admin]
      responses:
        '200':
          description: Usuario removido.
          content:
            text/plain:
              schema: { type: string }
              example: Usuario deletado com sucesso
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFoundText' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ----------------------------------------------------------- Consentimento
  /api/consents/policy:
    get:
      tags: [Consentimento]
      summary: Finalidades, versoes vigentes e textos dos documentos
      operationId: getConsentPolicy
      security: []
      description: |
        Publico; usado nas telas de cadastro. Cada finalidade tem um tipo: `acceptance` (aceite dos
        Termos de Uso), `acknowledgment` (ciencia da Politica de Privacidade) ou `consent`
        (consentimento; `highlighted` = destacado). Finalidades com `required: false` sao opcionais.
      parameters:
        - name: role
          in: query
          required: false
          schema: { type: string, enum: [gestante, medico] }
          description: Filtra as finalidades do perfil.
      responses:
        '200':
          description: Politica de consentimento vigente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentPolicy' }
        '400':
          description: Perfil invalido.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentError' }

  /api/consents/me:
    get:
      tags: [Consentimento]
      summary: Status de consentimento do usuario autenticado
      operationId: getMyConsents
      security: [{ bearerAuth: [] }]
      description: O titular e sempre o usuario do token.
      responses:
        '200':
          description: Status por finalidade (o registro mais recente vale).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/consents:
    post:
      tags: [Consentimento]
      summary: Registra aceite, recusa ou revogacao do usuario autenticado
      operationId: recordMyConsent
      security: [{ bearerAuth: [] }]
      description: |
        Cada decisao gera um novo registro; revogar nao altera o aceite anterior (registros protegidos
        durante o periodo de retencao). Aceite e recusa exigem a versao vigente; a revogacao vale para
        a finalidade. Decisoes por tipo: `acceptance` aceita/recusa, `acknowledgment` so aceita,
        `consent` aceita/recusa/revoga. So e possivel decidir finalidades do proprio perfil.
        O titular e sempre o usuario do token (nao ha ID de usuario no corpo).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose, decision]
              properties:
                purpose: { type: string }
                decision: { type: string, enum: [accepted, refused, revoked] }
                version: { type: string, description: Obrigatoria para accepted e refused. }
            example:
              purpose: uso_ia
              decision: revoked
      responses:
        '201':
          description: Decisao registrada; devolve o registro e o status atualizado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  consent:
                    type: object
                    properties:
                      id: { type: integer }
                      purpose: { type: string }
                      version: { type: string }
                      decision: { type: string }
                      created_at: { type: string, format: date-time }
                  status: { $ref: '#/components/schemas/ConsentStatus' }
        '400':
          description: Finalidade desconhecida ou decisao invalida.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: Versao do termo desatualizada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ------------------------------------------------------------ Privacidade
  /api/privacy/export:
    post:
      tags: [Privacidade]
      summary: Exporta em JSON os dados do titular autenticado (LGPD art. 18)
      operationId: exportMyData
      security: [{ bearerAuth: [] }]
      description: |
        Direito de acesso e portabilidade (E7-02.1). O titular e sempre o usuario do token; nao ha ID
        no corpo nem na URL. Exige a confirmacao da senha. A gestante recebe conta, consentimentos,
        prontuario, gestacoes, eventos, historicos, pedidos de exame, documentos (metadados e texto
        extraido) e vinculos; o medico recebe conta, consentimentos e o proprio perfil profissional,
        nunca dados de pacientes. Nao inclui senhas, chaves, caminhos de arquivo, registros internos
        de seguranca nem dados de terceiros. Fica fora do bloqueio por consentimento. Cada pedido,
        aceito ou recusado, gera registro em audit_logs (acao DATA_EXPORT) apenas com contagens.
        Limite padrao de 5 pedidos a cada 15 minutos (DATA_EXPORT_RATE_LIMIT_MAX).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, description: Senha atual do titular. }
            example:
              password: senha-sintetica-123
      responses:
        '200':
          description: Arquivo JSON enviado como anexo (Content-Disposition), com Cache-Control no-store.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataExport' }
        '400':
          description: Senha nao informada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: Confirme sua senha para exportar os dados, code: PASSWORD_REQUIRED }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: |
            Senha incorreta, conta inativa ou usuario inexistente (mesma resposta). E 403, e nao 401, para o
            app nao tratar a senha errada como sessao expirada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: Senha incorreta, code: INVALID_PASSWORD }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/privacy/delete:
    post:
      tags: [Privacidade]
      summary: Exclui (gestante) ou anonimiza (medico) a conta do titular autenticado
      operationId: deleteMyAccount
      security: [{ bearerAuth: [] }]
      description: |
        Direito de eliminacao (E7-02, LGPD art. 18, VI). O titular e sempre o usuario do token. Exige a
        senha atual e o campo `confirmation` igual a `EXCLUIR`. Gestante: a conta e apagada com os dados
        clinicos em cascata, e os arquivos cifrados dos exames sao removidos do disco depois do COMMIT.
        Medico: a conta e anonimizada e desativada (nome, e-mail, CRM e telefone substituidos) e os
        vinculos com pacientes sao apagados; pedidos de exame e laudos continuam no prontuario das
        pacientes. Administrador: fora do autoatendimento. Consentimentos e audit_logs sao mantidos
        ate o fim do projeto. Fica fora do bloqueio por consentimento. Gera ACCOUNT_DELETED em
        audit_logs, so com modo e contagens. Limite padrao de 5 pedidos a cada 15 minutos
        (ACCOUNT_DELETION_RATE_LIMIT_MAX). Backups so sao limpos quando expiram.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, confirmation]
              properties:
                password: { type: string, description: Senha atual do titular. }
                confirmation: { type: string, enum: [EXCLUIR] }
            example:
              password: senha-sintetica-123
              confirmation: EXCLUIR
      responses:
        '200':
          description: Conta excluida (gestante) ou anonimizada (medico).
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  mode: { type: string, enum: [deleted, anonymized] }
              example: { message: Conta excluída, mode: deleted }
        '400':
          description: Senha ou confirmacao ausentes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: Digite EXCLUIR para confirmar, code: CONFIRMATION_REQUIRED }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: |
            Senha incorreta, conta inativa ou inexistente (INVALID_PASSWORD), ou perfil administrador
            (ACCOUNT_DELETION_NOT_SELF_SERVICE). E 403, e nao 401, para o app nao tratar como sessao expirada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: Senha incorreta, code: INVALID_PASSWORD }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ----------------------------------------------------------------- Medicos
  /api/doctors:
    post:
      tags: [Medicos]
      summary: Cadastra um medico (CRM/UF)
      operationId: createDoctor
      security: []
      description: |
        Rota publica com rate limit de cadastro (`REGISTER_RATE_LIMIT_MAX`). Exige o aceite dos Termos
        de Uso do perfil medico e a ciencia da Politica de Privacidade (`consents`), gravados na mesma
        transacao. O aceite do medico nao substitui a autorizacao da gestante sobre os dados dela.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDoctorRequest' }
            example:
              name: Dra. Ana Exemplo
              email: ana.medica@example.com
              password: senha-sintetica-123
              birthdate: '1985-08-20'
              crm: '000000'
              crm_estado: PE
              especialidade: Obstetricia
              consents:
                - { purpose: termos_de_uso_medico, version: 0.1-rascunho }
                - { purpose: politica_de_privacidade, version: 0.1-rascunho }
      responses:
        '201':
          description: Medico criado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
                  doctor:
                    type: object
                    additionalProperties: true
                    description: Dados profissionais (CRM, UF, especialidade).
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      tags: [Medicos]
      summary: Lista médicos para decisão de aprovação
      operationId: listDoctors
      security: [{ bearerAuth: [] }]
      x-roles: [admin]
      parameters:
        - name: approval_status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, approved, rejected, revoked]
      responses:
        '200':
          description: Lista de perfis médicos com estado de aprovação.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DoctorApprovalRecord' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/doctors/me/approval:
    get:
      tags: [Medicos]
      summary: Consulta o estado de aprovação do próprio cadastro
      operationId: getMyDoctorApproval
      security: [{ bearerAuth: [] }]
      x-roles: [medico]
      responses:
        '200':
          description: Estado atual da aprovação.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DoctorApprovalStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/doctors/me:
    put:
      tags: [Medicos]
      summary: Reenvia dados profissionais após rejeição ou revogação
      operationId: resubmitDoctorApproval
      security: [{ bearerAuth: [] }]
      x-roles: [medico]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DoctorResubmissionRequest' }
      responses:
        '200':
          description: Dados reenviados para análise.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  doctor: { $ref: '#/components/schemas/DoctorApprovalStatus' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/doctors/{id}/approval:
    post:
      tags: [Medicos]
      summary: Decide aprovação de um médico
      operationId: decideDoctorApproval
      security: [{ bearerAuth: [] }]
      x-roles: [admin]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DoctorApprovalDecision' }
      responses:
        '200':
          description: Decisão registrada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  doctor: { $ref: '#/components/schemas/DoctorApprovalStatus' }
                  approval_status: { type: string, enum: [approved, rejected, revoked] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  # --------------------------------------------------------------- Gestantes
  /api/pregnants:
    post:
      tags: [Gestantes]
      summary: Cria o registro de gestante do usuario
      operationId: createPregnant
      security: [{ bearerAuth: [] }]
      x-roles: [admin, gestante]
      description: A gestante cria o proprio registro. `admin` pode informar `user_id` de outro usuario.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: integer
                  description: Apenas para `admin`.
      responses:
        '201':
          description: Registro criado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PregnantRecord' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      tags: [Gestantes]
      summary: Lista gestantes visiveis ao usuario
      operationId: getPregnants
      security: [{ bearerAuth: [] }]
      x-roles: [admin, medico]
      description: '`admin` ve todas; `medico` ve apenas gestantes com vinculo ativo.'
      responses:
        '200':
          description: Lista resumida, ordenada por nome.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PregnantSummary' }
              example:
                - pregnant_id: 1
                  user_id: 5
                  patient_name: Maria Exemplo
                  birthdate: '1995-04-12'
                  semanas_gestacao: 24
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/pregnants/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Gestantes]
      summary: Consulta o prontuario de uma gestante
      operationId: getPregnantById
      security: [{ bearerAuth: [] }]
      description: |
        Retorna o prontuario descriptografado (dados da gestante, gestacao mais recente e eventos).
        `admin` acessa qualquer gestante; a gestante, apenas o proprio registro; o medico, apenas
        gestantes com vinculo ativo.
      responses:
        '200':
          description: Prontuario.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PregnantDetails' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [Gestantes]
      summary: Atualiza dados clinicos da gestante
      operationId: updatePregnant
      security: [{ bearerAuth: [] }]
      x-roles: [admin, medico]
      description: Apenas campos clinicos de `config/dataClassification.js` (`PREGNANT_CLINICAL_FIELDS`). Medico precisa de vinculo ativo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              minProperties: 1
            example:
              altura: 1.65
      responses:
        '200':
          description: Registro atualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PregnantRecord' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/pregnants/{id}/alerts:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Gestantes]
      summary: Alertas semaforicos da gestante
      operationId: getPatientAlerts
      security: [{ bearerAuth: [] }]
      x-roles: [admin, medico]
      description: Medico precisa de vinculo ativo com a gestante.
      responses:
        '200':
          description: Classificacao de risco por categoria.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertReport' }
              example:
                patient_id: '1'
                patient_name: Maria Exemplo
                overall_level: yellow
                alert_counts: { green: 2, yellow: 1, red: 0 }
                categories:
                  pressao_arterial:
                    level: yellow
                    label: Pre-hipertensao
                    detail: PA 132/86 mmHg (pre-hipertensao)
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  # --------------------------------------------------------------- Gestacoes
  /api/pregnancies:
    post:
      tags: [Gestacoes]
      summary: Registra uma gestacao
      operationId: createPregnancy
      security: [{ bearerAuth: [] }]
      x-roles: [admin, gestante, medico]
      description: Exige acesso a gestante informada (propria gestante, medico vinculado ou admin).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePregnancyRequest' }
            example:
              pregnant_id: 1
              weeks: 12
              dum: '2026-06-01'
              dpp: '2027-03-08'
              ig_ultrassonografia: '12s2d'
      responses:
        '201':
          description: Gestacao criada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pregnancy' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      tags: [Gestacoes]
      summary: Lista gestacoes visiveis ao usuario
      operationId: getPregnancies
      security: [{ bearerAuth: [] }]
      x-roles: [admin, gestante, medico]
      description: '`admin` ve todas; medico, as das gestantes vinculadas; gestante, as proprias.'
      responses:
        '200':
          description: Lista de gestacoes, mais recentes primeiro.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Pregnancy' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/pregnancies/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    put:
      tags: [Gestacoes]
      summary: Atualiza sinais da gestacao
      operationId: updatePregnancy
      security: [{ bearerAuth: [] }]
      x-roles: [admin, medico]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePregnancyRequest' }
            example:
              glicemia: 88
      responses:
        '200':
          description: Gestacao atualizada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pregnancy' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFoundText' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ----------------------------------------------------------------- Eventos
  /api/pregnancyEvents:
    post:
      tags: [Eventos]
      summary: Registra um evento da gestacao
      operationId: createEvent
      security: [{ bearerAuth: [] }]
      x-roles: [admin, medico]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateEventRequest' }
            example:
              pregnancy_id: 11
              descricao: Consulta de rotina sem intercorrencias
              data_evento: '2026-09-15'
      responses:
        '201':
          description: Evento criado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PregnancyEvent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      tags: [Eventos]
      summary: Lista eventos de uma gestacao
      operationId: getEvents
      security: [{ bearerAuth: [] }]
      x-roles: [admin, gestante, medico]
      description: |
        **Atencao:** a implementacao atual le `pregnancy_id` do corpo da requisicao, mesmo sendo GET.
        Varios clientes HTTP nao enviam corpo em GET; mantido como esta para nao alterar o
        comportamento da rota (fora do escopo da E1-09).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pregnancy_id]
              properties:
                pregnancy_id: { type: integer }
            example:
              pregnancy_id: 11
      responses:
        '200':
          description: Eventos da gestacao.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PregnancyEvent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/pregnancyEvents/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    put:
      tags: [Eventos]
      summary: Atualiza um evento
      operationId: updatePregnancyEvent
      security: [{ bearerAuth: [] }]
      x-roles: [admin, medico]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateEventRequest' }
            example:
              descricao: Consulta remarcada
      responses:
        '200':
          description: Evento atualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PregnancyEvent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFoundText' }
        '500': { $ref: '#/components/responses/InternalError' }

  # -------------------------------------------------------------- Documentos
  /api/documents:
    post:
      tags: [Documentos]
      summary: Envia um documento (laudo/exame)
      operationId: uploadDocument
      security: [{ bearerAuth: [] }]
      x-roles: [admin, gestante, medico]
      description: |
        Upload multipart (limite `DOCUMENT_MAX_UPLOAD_BYTES`, padrao 25 MB). O arquivo e cifrado em
        disco e a extracao de texto e iniciada em segundo plano. A gestante envia apenas para a
        propria gestacao; o medico, para gestantes vinculadas.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/UploadDocumentRequest' }
      responses:
        '201':
          description: Documento recebido.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  document: { $ref: '#/components/schemas/Document' }
        '400':
          description: Arquivo ausente (texto) ou campos obrigatorios ausentes (JSON).
          content:
            text/plain:
              schema: { type: string }
              example: Nenhum arquivo enviado
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      tags: [Documentos]
      summary: Lista documentos de uma gestante
      operationId: getDocuments
      security: [{ bearerAuth: [] }]
      x-roles: [admin, gestante, medico]
      parameters:
        - name: pregnant_id
          in: query
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Documentos, mais recentes primeiro.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Document' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/documents/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Documentos]
      summary: Consulta metadados de um documento
      operationId: getDocumentById
      security: [{ bearerAuth: [] }]
      x-roles: [admin, medico]
      responses:
        '200':
          description: Metadados do documento.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [Documentos]
      summary: Atualiza nome/tipo do documento
      operationId: updateDocument
      security: [{ bearerAuth: [] }]
      x-roles: [admin, medico]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateDocumentRequest' }
            example:
              document_name: Hemograma 2o trimestre
      responses:
        '200':
          description: Documento atualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFoundText' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Documentos]
      summary: Remove um documento
      operationId: deleteDocument
      security: [{ bearerAuth: [] }]
      x-roles: [admin, medico]
      responses:
        '200':
          description: Documento removido.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
              example:
                message: Documento removido com sucesso
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/documents/{id}/download:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Documentos]
      summary: Baixa o arquivo original (decifrado)
      operationId: downloadDocument
      security: [{ bearerAuth: [] }]
      x-roles: [admin, gestante, medico]
      responses:
        '200':
          description: Conteudo binario do arquivo.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/documents/{id}/text:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Documentos]
      summary: Consulta o texto extraido do documento
      operationId: getDocumentExtractedText
      security: [{ bearerAuth: [] }]
      x-roles: [admin, medico]
      responses:
        '200':
          description: Extracao concluida.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentText' }
        '202':
          description: Extracao ainda nao concluida.
          content:
            application/json:
              schema:
                type: object
                properties:
                  document_id: { type: integer }
                  extraction_status: { type: string }
                  extraction_error: { type: [string, 'null'] }
              example:
                document_id: 7
                extraction_status: processing
                extraction_error: null
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/documents/{id}/extract:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Documentos]
      summary: Reenfileira a extracao de texto
      operationId: retryDocumentTextExtraction
      security: [{ bearerAuth: [] }]
      x-roles: [admin, medico]
      responses:
        '202':
          description: Documento enviado para reprocessamento.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  document_id: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/documents/{id}/report:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    put:
      tags: [Documentos]
      summary: Registra o relatorio (devolutiva) do medico sobre o documento
      operationId: updateDocumentReport
      security: [{ bearerAuth: [] }]
      x-roles: [admin, medico]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [report_comment]
              properties:
                report_comment:
                  type: string
                  maxLength: 5000
            example:
              report_comment: Resultados dentro da referencia. Manter acompanhamento.
      responses:
        '200':
          description: Relatorio salvo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  document: { $ref: '#/components/schemas/Document' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

