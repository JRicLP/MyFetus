        document:
          type: string
          format: binary
        pregnant_id: { type: integer }
        exam_request_id:
          type: integer
          minimum: 1
          description: Solicitação pendente à qual o documento será vinculado. Obrigatório para gestante.
        document_name: { type: string }
        document_type: { type: string, description: 'Padrao: mimetype do arquivo.' }
    UpdateDocumentRequest:
      type: object
      minProperties: 1
      properties:
        document_name: { type: string }
        document_type: { type: string }
    ExamRequest:
      type: object
      properties:
        id: { type: integer }
        pregnant_id: { type: integer }
