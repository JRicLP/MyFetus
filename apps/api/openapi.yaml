      properties:
        pregnant_id: { type: integer }
        weeks: { type: integer }
        is_checked: { type: boolean, default: false }
        dum: { type: string, format: date }
        dpp: { type: string, format: date }
        ccn: { type: number, default: 0 }
        dgm: { type: number, default: 0 }
        glicemia: { type: number, default: 0 }
        frequencia_cardiaca: { type: number, default: 0 }
        altura_uterina: { type: number, default: 0 }
        regularidade_do_ciclo: { type: boolean, default: true }
        ig_ultrassonografia: { type: string }
    UpdatePregnancyRequest:
      type: object
      minProperties: 1
      properties:
        glicemia: { type: number }
        frequencia_cardiaca: { type: number }
        altura_uterina: { type: number }

    PregnancyEvent:
      type: object
      additionalProperties: true
      properties:
        id: { type: integer }
        pregnancy_id: { type: integer }
        descricao: { type: string }
        data_evento: { type: string, format: date }
        created_at: { type: string, format: date-time }
    CreateEventRequest:
      type: object
      required: [pregnancy_id, descricao, data_evento]
      properties:
        pregnancy_id: { type: integer }
        descricao: { type: string }
        data_evento: { type: string, format: date }
    UpdateEventRequest:
      type: object
      minProperties: 1
      properties:
        descricao: { type: string }
        data_evento: { type: string, format: date }

    Document:
      type: object
