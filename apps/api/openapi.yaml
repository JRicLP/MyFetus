  # ---------------------------------------------------------------- Medicoes
  /api/medicoes:
    post:
      tags: [Medicoes]
      summary: Registra medida fetal (comprimento do femur)
      operationId: createFetalMeasurement
      security: [{ bearerAuth: [] }]
      x-roles: [admin, medico]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idade_gestacional_semanas, comp_femur_mm]
              properties:
                idade_gestacional_semanas: { type: number }
                comp_femur_mm: { type: number }
            example:
              idade_gestacional_semanas: 24
              comp_femur_mm: 43
      responses:
        '201':
          description: Medicao salva, com comprimento fetal estimado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensagem: { type: string }
                  medicao:
                    type: object
                    additionalProperties: true
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ---------------------------------------------------------------- Vinculos
  /api/doctor-patient-links/search:
    get:
      tags: [Vinculos]
